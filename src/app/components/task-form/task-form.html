<!-- 1 -->
 <h2 class="title">Add Task</h2>
<form [formGroup]="taskForm" (ngSubmit)="onSave()">

  <div>
    <label>Title</label>
    <input type="text" formControlName="title" class="form-control" />
    <small class="text-danger" *ngIf="taskForm.get('title')?.touched && taskForm.get('title')?.invalid">
      Title is required (min 3 characters)
    </small>
  </div>

  <div class="mt-2">
    <label>Description</label>
    <textarea formControlName="description" class="form-control"></textarea>
  </div>

  <div class="mt-2">
    <label>Category</label>
    <select formControlName="categoryId" class="form-control">
      <option value="">Select Category</option>
      <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
    </select>
  </div>

  <div class="mt-2">
    <label>Status</label>
    <select formControlName="status" class="form-control">
      <option value="">Select Status</option>
      <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
    </select>
  </div>

  <div class="mt-3">
    <button type="submit" class="btn btn-primary me-2" [disabled]="taskForm.invalid">
      Save
    </button>

    <button type="button" class="btn btn-secondary" (click)="onCancel()">
      Cancel
    </button>
  </div>

</form>
