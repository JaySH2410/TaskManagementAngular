<div class="container">
    <!-- <div class="card">
        <h2 class="title">{{ isEdit ? 'Edit Task' : 'Add Task' }}</h2>
    </div> -->

    <div class="card">
        <form [formGroup]="taskForm" (ngSubmit)="onSave()">

            <div class="form-grid">
                <label class="form-label">Title</label>
                <input type="text" formControlName="title" class="form-control" />
                <div class="error" *ngIf="taskForm.controls.title.touched && taskForm.controls.title.invalid">
                    <small *ngIf="taskForm.controls.title.errors?.['required']">Title is required.</small>
                    <small *ngIf="taskForm.controls.title.errors?.['minlength']">Minimum 3 characters required.</small>
                </div>
                <label class="form-label">Description</label>
                <textarea formControlName="description" class="form-control"></textarea>
                <div class="error"
                    *ngIf="taskForm.controls.description.touched && taskForm.controls.description.invalid">
                    <small *ngIf="taskForm.controls.description.errors?.['required']">Title is required.</small>
                    <small *ngIf="taskForm.controls.description.errors?.['minlength']">Minimum 3 characters
                        required.</small>
                </div>

                <label class="form-label">Category</label>
                <select formControlName="categoryId" class="form-control">
                    <!-- <option value="">Select Category</option> -->
                    <option *ngFor="let c of categories()" [value]="c.id">{{ c.name }}</option>
                </select>
                <div class="error" *ngIf="taskForm.controls.categoryId.touched && taskForm.controls.categoryId.invalid">
                    <small>Category is required.</small>
                </div>

                <label class="form-label">Status</label>
                <select formControlName="status" class="form-control">
                    <!-- <option value="">Select Status</option> -->
                    <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
                </select>
                <div class="error" *ngIf="taskForm.controls.status.touched && taskForm.controls.status.invalid">
                    <small>Status is required.</small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button" [disabled]="taskForm.invalid">
                        <!-- (click)="onSave()" -->
                        {{ isEdit ? 'Update' : 'Save' }}
                    </button>
                    <button type="button" class="button" (click)="onCancel()">
                        Cancel
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
