<div class="container">
    <div class="card">
        <form [formGroup]="categoryForm" (ngSubmit)="onSave()">

            <div class="form-grid">
                <label class="form-label">Title</label>
                <input type="text" formControlName="name" class="form-control" />
                 <div class="error" *ngIf="categoryForm.controls.name.touched && categoryForm.controls.name.invalid">
                    <small *ngIf="categoryForm.controls.name.errors?.['required']">Category name is required.</small>
                    <small *ngIf="categoryForm.controls.name.errors?.['minlength']">Minimum 3 characters required.</small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button" [disabled]="categoryForm.invalid" (click)="onSave()">
                        Save
                    </button>
                    <button type="button" class="button" (click)="onCancel()">
                        Cancel
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
